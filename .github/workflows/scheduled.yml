name: Scheduled scout and queue

# Read-only jobs. Inputs come from encrypted repository secrets, never from files in the repo.
# Results are uploaded as short-lived workflow artifacts (private to repo collaborators) and are
# never committed. Nothing is written to Ahrefs, Google Sheets, Project Central or any website.
#
# Repository secrets (Settings > Secrets and variables > Actions > Secrets):
#   SCOUT_DOMAINS_CSV  CSV text with columns client_id,domain                 (used by scout)
#   CONTROL_CSV        CSV text with the queue input columns (see README)     (used by queue)
# A job whose secret is missing is skipped with a notice.
#
# Kill switch: set the repository variable SEO_KILL_SWITCH to 1 and every job is skipped.

on:
  schedule:
    - cron: '30 3 1 * *'    # scout: 1st of each month, 03:30 UTC (09:00 IST)
    - cron: '30 3 * * 1-5'  # queue: Monday to Friday, 03:30 UTC (09:00 IST)
  workflow_dispatch:
    inputs:
      command:
        description: Which job to run
        type: choice
        options: [scout, queue, both]
        default: scout
      limit:
        description: Scout only the first N sites (blank for all)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: scheduled-scout-queue
  cancel-in-progress: false

jobs:
  scout:
    if: >-
      vars.SEO_KILL_SWITCH != '1' && (
        (github.event_name == 'schedule' && github.event.schedule == '30 3 1 * *') ||
        (github.event_name == 'workflow_dispatch' && inputs.command != 'queue')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SCOUT_DOMAINS_CSV: ${{ secrets.SCOUT_DOMAINS_CSV }}
      LIMIT: ${{ inputs.limit }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Write input from secret
        id: input
        run: |
          if [ -z "$SCOUT_DOMAINS_CSV" ]; then
            echo "::notice::SCOUT_DOMAINS_CSV secret is not set, skipping scout."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p data
          printf '%s\n' "$SCOUT_DOMAINS_CSV" > data/domains.csv
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Scout
        if: steps.input.outputs.ready == 'true'
        run: |
          args=(scout --in data/domains.csv --out out/scout.csv --concurrency 3)
          if [ -n "$LIMIT" ]; then args+=(--limit "$LIMIT"); fi
          node src/cli.js "${args[@]}"
      - name: Upload scout results
        if: steps.input.outputs.ready == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: scout-${{ github.run_number }}
          path: out/scout.csv
          retention-days: 30
          if-no-files-found: error

  queue:
    if: >-
      vars.SEO_KILL_SWITCH != '1' && (
        (github.event_name == 'schedule' && github.event.schedule == '30 3 * * 1-5') ||
        (github.event_name == 'workflow_dispatch' && inputs.command != 'scout')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CONTROL_CSV: ${{ secrets.CONTROL_CSV }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Write input from secret
        id: input
        run: |
          if [ -z "$CONTROL_CSV" ]; then
            echo "::notice::CONTROL_CSV secret is not set, skipping queue."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p data
          printf '%s\n' "$CONTROL_CSV" > data/control.csv
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Build queue
        if: steps.input.outputs.ready == 'true'
        run: node src/cli.js queue --in data/control.csv --out out/queue.csv
      - name: Upload queue
        if: steps.input.outputs.ready == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: queue-${{ github.run_number }}
          path: |
            out/queue.csv
            out/queue-skipped.csv
          retention-days: 14
          if-no-files-found: error
